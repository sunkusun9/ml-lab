site_name: ml-labs
site_description: ML pipeline and experiment management library
repo_url: https://github.com/sunkusun9/ml-labs
repo_name: sunkusun9/ml-labs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Concepts:
    - concepts/index.md
    - concepts/architecture.md
    - concepts/pipeline.md
    - concepts/state-model.md
    - concepts/data-flow.md
  - User Guide:
    - guide/project-pipeline.md
    - guide/edges-dsl.md
    - guide/experimenter-trials.md
    - guide/collectors.md
    - guide/trainer-predictors.md
    - guide/adapters.md
    - guide/processors.md
    - guide/nn.md
  - Serving Guide:
    - serving/inferencer.md
  - API Reference:
    - reference/index.md
    - reference/project.md
    - reference/pipeline.md
    - reference/experimenter.md
    - reference/trials.md
    - reference/trainer.md
    - reference/inferencer.md
    - reference/collectors.md
    - reference/connector.md
    - reference/adapters.md
    - reference/processors.md
    - reference/nn.md
    - reference/filters.md
    - reference/logging.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
